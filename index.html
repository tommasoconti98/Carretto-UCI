<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Carretto UCI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root { 
            --bg: #000000; 
            --card: #1C1C1E; 
            --accent: #0A84FF; 
            --red: #FF453A; 
            --orange: #FF9F0A; 
            --green: #32D74B; 
            --text-gray: #8E8E93;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { background: var(--bg); margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            color: white;
            padding: 0 0 env(safe-area-inset-bottom);
            overflow-x: hidden;
        }

        body.modal-open { overflow: hidden; position: fixed; width: 100%; }

        /* --- FATHOM HAPTIC WORKAROUND (iOS 26.5+) --- */
        .haptic-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(10); /* Scala lo switch per coprire qualsiasi tasto */
            opacity: 0.001; /* Trasparente ma intercettabile fisicamente dal tocco */
            z-index: 10;
            margin: 0; padding: 0;
            cursor: pointer;
        }
        
        /* Assicura che i layer aptici non escano dai bordi dei pulsanti */
        .product-btn, .btn-circle, .btn-close, .pay-btn, .taglio-btn, .action-btn, .btn-delete, .add-btn {
            position: relative;
            overflow: hidden;
        }

        /* --- HEADER PRINCIPALE --- */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px; 
            position: sticky; top: 0; 
            background: var(--bg); z-index: 100;
        }
        .total-box { flex: 1; }
        .total-label { font-size: 11px; font-weight: 700; color: var(--text-gray); text-transform: uppercase; margin-bottom: 4px; }
        .total-amount { font-size: 44px; font-weight: 800; white-space: nowrap; letter-spacing: -1px; }
        .header-btns { display: flex; gap: 12px; }
        .btn-circle { 
            width: 48px; height: 48px; border-radius: 50%; border: none; 
            color: white; display: flex; align-items: center; justify-content: center; 
            font-size: 20px; cursor: pointer;
        }

        /* --- SEZIONI E GRIGLIA PRODOTTI --- */
        #product-sections { padding-bottom: 20px; }
        .category-title { font-size: 22px; font-weight: 800; margin: 10px 20px 15px; color: white; letter-spacing: -0.5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 25px; }
        
        .product-btn { 
            background: var(--card); border: none; border-radius: 16px; padding: 18px 10px;
            color: white; text-align: center; display: flex; flex-direction: column;
            justify-content: center; min-height: 100px;
            word-break: break-word;
        }
        .product-btn:active { background: #2C2C2E; }
        .p-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .p-price { font-size: 14px; color: var(--accent); font-weight: 500; }

        /* --- MODALITÀ EDIT --- */
        .editable-text { border: 1px dashed white; border-radius: 4px; padding: 2px; display: inline-block; min-width: 40px; outline: none; }
        .add-btn { background: transparent; border: 2px dashed #333; color: #333; font-size: 40px; display: flex; align-items: center; justify-content: center; border-radius: 16px; min-height: 100px; cursor: pointer; }
        
        .btn-delete {
            position: absolute; top: -8px; right: -8px;
            background: var(--red); color: white;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; border: 2px solid var(--bg);
            z-index: 5;
        }

        .footer-actions { padding: 20px; display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; background: var(--bg); }
        .action-btn { padding: 12px 25px; border-radius: 20px; font-weight: 600; cursor: pointer; border: 1px solid #333; font-size: 14px; }
        .btn-edit { background: #1c1c1e; color: var(--text-gray); }
        .btn-save { background: var(--green); color: white; border: none; }
        .btn-reset { background: #1c1c1e; color: var(--red); }

        /* --- PAGINA PAGAMENTI (SHEET) --- */
        .sheet { 
            position: fixed; top: 0; left: 0; width: 100%; 
            height: 100dvh; 
            background: var(--bg); z-index: 1000; display: none; flex-direction: column; 
        }
        
        .sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px; 
            background: var(--bg); z-index: 10;
        }
        .sheet-title { font-size: 32px; font-weight: 800; }
        .btn-close { 
            background: #2C2C2E; color: var(--text-gray); border: none; 
            border-radius: 50%; width: 32px; height: 32px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .sheet-content { padding: 0 20px 40px; overflow-y: auto; flex: 1; background: var(--bg); }
        .section-header { font-size: 13px; color: var(--text-gray); text-transform: uppercase; margin: 25px 0 8px 15px; font-weight: 600; }
        .inset-group { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #2C2C2E; font-size: 17px; }
        .list-item span:first-child { flex: 1; padding-right: 15px; word-break: break-word; }
        .list-item span:last-child { white-space: nowrap; flex-shrink: 0; }
        .list-item:last-child { border-bottom: none; }

        .pay-btn { width: 100%; padding: 16px; border-radius: 25px; border: none; font-size: 17px; font-weight: 700; margin: 10px 0; cursor: pointer; text-align: center; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
        
        .quick-cash { display: flex; gap: 10px; margin: 20px 0; justify-content: center; }
        .taglio-btn { background: var(--card); border: none; color: var(--accent); padding: 12px 20px; border-radius: 20px; font-size: 17px; font-weight: 500; flex: 1; text-align: center; }

        .input-group { background: var(--card); border-radius: 16px; display: flex; align-items: center; padding: 6px 16px; margin-bottom: 20px; }
        input { background: transparent; border: none; color: white; padding: 12px 0; font-size: 22px; width: 100%; outline: none; }
		
        .clear-icon { 
            color: var(--text-gray); font-size: 20px; padding: 5px 10px; cursor: pointer; 
            position: relative; overflow: hidden; display: inline-block;
        }

        .resto-area { background: rgba(255, 69, 58, 0.15); padding: 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .resto-label { color: var(--red); font-size: 17px; font-weight: 700; }
        .resto-value { color: var(--red); font-size: 22px; font-weight: 700; }

        /* --- SEZIONE CREDITS --- */
        .credits { text-align: center; margin-top: 50px; padding-bottom: 30px; color: var(--text-gray); font-size: 13px; line-height: 1.6; background: var(--bg); }
        .credits a { color: var(--accent); text-decoration: none; display: block; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="total-box">
            <div class="total-label">Totale Carrello</div>
            <div id="main-total" class="total-amount">€ 0,00</div>
        </div>
        <div class="header-btns">
            <button class="btn-circle" style="background: var(--red)" onclick="triggerHaptic(); clearCart()">
                <input type="checkbox" switch class="haptic-layer">🗑
            </button>
            <button class="btn-circle" style="background: var(--orange)" onclick="triggerHaptic(); toggleSheet('report-sheet', true)">
                <input type="checkbox" switch class="haptic-layer">📊
            </button>
            <button class="btn-circle" style="background: #333" id="pay-btn-icon" onclick="triggerHaptic(); toggleSheet('pay-sheet', true)" disabled>
                <input type="checkbox" switch class="haptic-layer">💳
            </button>
        </div>
    </div>

    <div id="product-sections"></div>

    <div class="footer-actions" id="footer-controls">
        <button class="action-btn btn-edit" onclick="triggerHaptic(); enterEditMode()">
            <input type="checkbox" switch class="haptic-layer">EDIT
        </button>
    </div>

    <div id="pay-sheet" class="sheet">
        <div class="sheet-header">
            <span class="sheet-title">Cassa</span>
            <button class="btn-close" onclick="triggerHaptic(); toggleSheet('pay-sheet', false)">
                <input type="checkbox" switch class="haptic-layer">✕
            </button>
        </div>
        <div class="sheet-content">
            <div class="section-header">Riepilogo Ordine</div>
            <div class="inset-group" id="order-summary"></div>
            <div class="section-header">Pagamento con Carta</div>
            <button class="pay-btn btn-blue" onclick="triggerHaptic(); confirmPayment('carta')">
                <input type="checkbox" switch class="haptic-layer">PAGATO CON CARTA
            </button>
            <div class="section-header">Pagamento in Contanti</div>
            <div class="quick-cash">
                <button class="taglio-btn" onclick="triggerHaptic(); quickCash(2)"><input type="checkbox" switch class="haptic-layer">€2</button>
                <button class="taglio-btn" onclick="triggerHaptic(); quickCash(5)"><input type="checkbox" switch class="haptic-layer">€5</button>
                <button class="taglio-btn" onclick="triggerHaptic(); quickCash(10)"><input type="checkbox" switch class="haptic-layer">€10</button>
                <button class="taglio-btn" onclick="triggerHaptic(); quickCash(20)"><input type="checkbox" switch class="haptic-layer">€20</button>
                <button class="taglio-btn" onclick="triggerHaptic(); quickCash(50)"><input type="checkbox" switch class="haptic-layer">€50</button>
            </div>
            <div class="input-group">
                <input type="text" inputmode="decimal" id="cash-received" placeholder="Importo ricevuto" oninput="checkCash()">
                <span class="clear-icon" onclick="triggerHaptic(); clearInput()">
                    <input type="checkbox" switch class="haptic-layer">✕
                </span>
            </div>
            <div id="resto-container" style="display: none;">
                <div class="resto-area"><span class="resto-label">RESTO:</span><span id="resto-value" class="resto-value">€ 0,00</span></div>
                <button class="pay-btn btn-green" onclick="triggerHaptic(); confirmPayment('contanti')">
                    <input type="checkbox" switch class="haptic-layer">CONFERMA E CHIUDI
                </button>
            </div>
        </div>
    </div>

    <div id="report-sheet" class="sheet">
        <div class="sheet-header">
            <span class="sheet-title">Report</span>
            <button class="btn-close" onclick="triggerHaptic(); toggleSheet('report-sheet', false)">
                <input type="checkbox" switch class="haptic-layer">✕
            </button>
        </div>
        <div class="sheet-content">
            <div class="section-header">Incassi</div>
            <div class="inset-group">
                <div class="list-item"><span>Carta</span><span id="rep-carta">€ 0,00</span></div>
                <div class="list-item"><span>Contanti</span><span id="rep-contanti">€ 0,00</span></div>
                <div class="list-item" style="font-weight: 600;"><span>TOTALE</span><span id="rep-totale" style="color: var(--green); font-size: 20px;">€ 0,00</span></div>
            </div>
            <div class="section-header">Prodotti Venduti</div>
            <div class="inset-group" id="report-products"></div>
            
            <button class="pay-btn btn-red" onclick="triggerHaptic(); resetReport()">
                <input type="checkbox" switch class="haptic-layer">AZZERA REPORT GIORNALIERO
            </button>

            <div class="credits">
                Credits Tommaso Conti
                <a href="mailto:tommasoconti98@gmail.com">tommasoconti98@gmail.com</a>
            </div>
        </div>
    </div>

    <script>
        const defaultProdotti = [
            // Bevande
            {nome:"Acqua Nat 1L", prezzo:2.90, categoria:"Bevande"}, {nome:"Acqua Friz 0,7L", prezzo:2.60, categoria:"Bevande"},
            {nome:"Coca/Fanta/Tè (PET)", prezzo:4.00, categoria:"Bevande"}, {nome:"Monster", prezzo:3.40, categoria:"Bevande"},
            {nome:"Lurisia", prezzo:3.40, categoria:"Bevande"}, {nome:"Pilsner", prezzo:4.40, categoria:"Bevande"},
            {nome:"Nastro Azzurro", prezzo:4.00, categoria:"Bevande"}, {nome:"Bicchiere Free-Refill", prezzo:6.00, categoria:"Bevande"},
            // Salato
            {nome:"Pop Corn Salati", prezzo:5.60, categoria:"Salato"}, {nome:"Patatine Lays", prezzo:3.90, categoria:"Salato"},
            {nome:"Salamini Beretta", prezzo:3.50, categoria:"Salato"}, {nome:"Tuc Crisp", prezzo:3.50, categoria:"Salato"},
            // Dolce
            {nome:"Pop Corn Dolci", prezzo:6.60, categoria:"Dolce"}, {nome:"Pop Corn Cioccolato", prezzo:3.90, categoria:"Dolce"},
            {nome:"M&M'S (Arachidi / Cioccolato / Mini)", prezzo:4.90, categoria:"Dolce"}, {nome:"Maltisers", prezzo:4.90, categoria:"Dolce"},
            {nome:"Skittles", prezzo:4.10, categoria:"Dolce"}, {nome:"Mikado", prezzo:3.50, categoria:"Dolce"},
            {nome:"Milka Cookies", prezzo:3.50, categoria:"Dolce"}, {nome:"Candy Cup", prezzo:8.00, categoria:"Dolce"},
            {nome:"Chupa Chups", prezzo:1.20, categoria:"Dolce"},
            // Menù
            {nome:"Menù Medio Salato", prezzo:11.10, categoria:"Menù"}, {nome:"Menù Medio Dolce", prezzo:12.10, categoria:"Menù"}
        ];

        let prodotti = JSON.parse(localStorage.getItem('uci_listino_custom')) || defaultProdotti.map(p => ({...p}));
        let carrello = [];
        let stats = JSON.parse(localStorage.getItem('uci_v8_stats')) || { carta: 0, contanti: 0, vendite: {} };
        let isEditMode = false;

        // Mantieni la vibrazione nativa per i dispositivi Android
        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function renderGrid() {
            const container = document.getElementById('product-sections');
            container.innerHTML = '';
            
            const categorie = ['Bevande', 'Salato', 'Dolce', 'Menù'];
            
            categorie.forEach(cat => {
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = cat;
                container.appendChild(title);
                
                const grid = document.createElement('div');
                grid.className = 'grid';
                
                prodotti.forEach((p, index) => {
                    const pCat = p.categoria || 'Salato';
                    if (pCat !== cat) return;
                    
                    const itemContainer = document.createElement('div');
                    itemContainer.className = 'product-btn';
                    
                    if (isEditMode) {
                        // In edit mode l'overlay copre solo la X per permettere la digitazione sul testo
                        itemContainer.innerHTML = `
                            <div class="btn-delete" onclick="triggerHaptic(); deleteProduct(${index})">
                                <input type="checkbox" switch class="haptic-layer">✕
                            </div>
                            <span class="p-name editable-text" contenteditable="true" onblur="updateProdData(${index}, 'nome', this.innerText)">${p.nome}</span>
                            <span class="p-price editable-text" contenteditable="true" onblur="updateProdData(${index}, 'prezzo', this.innerText)">${p.prezzo.toFixed(2).replace('.',',')}</span>
                        `;
                    } else {
                        // In modalità cassa, l'overlay aptico copre l'intero tasto prodotto
                        const btn = document.createElement('button');
                        btn.className = 'product-btn';
                        btn.innerHTML = `
                            <input type="checkbox" switch class="haptic-layer">
                            <span class="p-name">${p.nome}</span>
                            <span class="p-price">€ ${p.prezzo.toFixed(2).replace('.',',')}</span>
                        `;
                        btn.onclick = () => { triggerHaptic(); carrello.push(p); updateUI(); };
                        grid.appendChild(btn);
                        return;
                    }
                    grid.appendChild(itemContainer);
                });

                if (isEditMode) {
                    const addBtn = document.createElement('div');
                    addBtn.className = 'add-btn';
                    addBtn.innerHTML = '<input type="checkbox" switch class="haptic-layer">+';
                    addBtn.onclick = () => { triggerHaptic(); addNewProduct(cat); };
                    grid.appendChild(addBtn);
                }
                
                container.appendChild(grid);
            });
        }

        function deleteProduct(index) {
            prodotti.splice(index, 1);
            renderGrid();
        }

        function updateProdData(index, field, value) {
            if (field === 'prezzo') {
                prodotti[index][field] = parseFloat(value.replace(',', '.')) || 0;
            } else {
                prodotti[index][field] = value;
            }
        }

        function addNewProduct(cat) {
            prodotti.push({nome: "Nuovo Prodotto", prezzo: 0.00, categoria: cat});
            renderGrid();
        }

        function enterEditMode() {
            isEditMode = true;
            renderGrid();
            document.getElementById('footer-controls').innerHTML = `
                <button class="action-btn btn-reset" onclick="triggerHaptic(); resetListino()">
                    <input type="checkbox" switch class="haptic-layer">RESET
                </button>
                <button class="action-btn btn-save" onclick="triggerHaptic(); saveListino()">
                    <input type="checkbox" switch class="haptic-layer">SALVA
                </button>
            `;
        }

        function saveListino() {
            localStorage.setItem('uci_listino_custom', JSON.stringify(prodotti));
            isEditMode = false;
            renderGrid();
            document.getElementById('footer-controls').innerHTML = `
                <button class="action-btn btn-edit" onclick="triggerHaptic(); enterEditMode()">
                    <input type="checkbox" switch class="haptic-layer">EDIT
                </button>
            `;
        }

        function resetListino() {
            if(confirm("Vuoi davvero ripristinare i prodotti e i prezzi originali? Verranno eliminati anche i prodotti aggiunti.")) {
                prodotti = defaultProdotti.map(p => ({...p}));
                localStorage.removeItem('uci_listino_custom');
                saveListino();
            }
        }

        function updateUI() {
            const totale = carrello.reduce((acc, p) => acc + p.prezzo, 0);
            document.getElementById('main-total').innerText = `€ ${totale.toFixed(2).replace('.',',')}`;
            
            const payBtn = document.getElementById('pay-btn-icon');
            const hapticInput = payBtn.querySelector('.haptic-layer');
            
            payBtn.disabled = carrello.length === 0;
            payBtn.style.background = carrello.length > 0 ? 'var(--green)' : '#333';
            
            // Disattiva il trucco aptico se il pulsante del carrello è vuoto (previene la vibrazione a vuoto)
            if (hapticInput) hapticInput.disabled = carrello.length === 0;
        }

        function clearCart() { carrello = []; updateUI(); }

        function toggleSheet(id, show) {
            const sheet = document.getElementById(id);
            sheet.style.display = show ? 'flex' : 'none';
            if(show) {
                document.body.classList.add('modal-open');
                if(id === 'pay-sheet') renderPay();
                if(id === 'report-sheet') renderReport();
            } else {
                document.body.classList.remove('modal-open');
            }
        }

        function renderPay() {
            const container = document.getElementById('order-summary');
            const totale = carrello.reduce((acc, p) => acc + p.prezzo, 0);
            
            const raggruppato = carrello.reduce((acc, p) => {
                if (!acc[p.nome]) {
                    acc[p.nome] = { qta: 0, prezzoUnitario: p.prezzo };
                }
                acc[p.nome].qta++;
                return acc;
            }, {});

            let html = Object.entries(raggruppato).map(([nome, dati]) => {
                const subTotale = dati.qta * dati.prezzoUnitario;
                return `
                    <div class="list-item">
                        <span>${nome} ${dati.qta > 1 ? `<b>(x${dati.qta})</b>` : ''}</span>
                        <span>€ ${subTotale.toFixed(2).replace('.',',')}</span>
                    </div>`;
            }).join('');

            html += `<div class="list-item" style="font-weight:600;"><span>DA PAGARE</span><span style="color:var(--accent);">€ ${totale.toFixed(2).replace('.',',')}</span></div>`;
            container.innerHTML = html;
            document.getElementById('resto-container').style.display = 'none';
            document.getElementById('cash-received').value = '';
        }

        function quickCash(val) {
            document.getElementById('cash-received').value = val.toFixed(2).replace('.', ',');
            checkCash();
        }

        function checkCash() {
            const totale = carrello.reduce((acc, p) => acc + p.prezzo, 0);
            const ricevuto = parseFloat(document.getElementById('cash-received').value.replace(',','.')) || 0;
            if(ricevuto >= totale && totale > 0) {
                document.getElementById('resto-value').innerText = `€ ${(ricevuto - totale).toFixed(2).replace('.',',')}`;
                document.getElementById('resto-container').style.display = 'block';
            } else { document.getElementById('resto-container').style.display = 'none'; }
        }

        function clearInput() { document.getElementById('cash-received').value = ''; checkCash(); }

        function confirmPayment(m) {
            const totale = carrello.reduce((acc, p) => acc + p.prezzo, 0);
            if(m === 'carta') stats.carta += totale; else stats.contanti += totale;
            carrello.forEach(p => { stats.vendite[p.nome] = (stats.vendite[p.nome] || 0) + 1; });
            localStorage.setItem('uci_v8_stats', JSON.stringify(stats));
            clearCart(); toggleSheet('pay-sheet', false);
        }

        function renderReport() {
            document.getElementById('rep-carta').innerText = `€ ${stats.carta.toFixed(2).replace('.',',')}`;
            document.getElementById('rep-contanti').innerText = `€ ${stats.contanti.toFixed(2).replace('.',',')}`;
            document.getElementById('rep-totale').innerText = `€ ${(stats.carta + stats.contanti).toFixed(2).replace('.',',')}`;
            const prodContainer = document.getElementById('report-products');
            let vHtml = Object.entries(stats.vendite).sort().map(([n, q]) => `<div class="list-item"><span>${n}</span><span>${q}</span></div>`).join('');
            prodContainer.innerHTML = vHtml || '<div class="list-item" style="color:gray; font-style:italic;">Nessuna vendita</div>';
        }

        function resetReport() {
            if(confirm("Sei sicuro di voler AZZERARE il report giornaliero?")) {
                triggerHaptic();
                stats = { carta: 0, contanti: 0, vendite: {} };
                localStorage.setItem('uci_v8_stats', JSON.stringify(stats));
                renderReport();
            }
        }

        renderGrid();
    </script>
</body>
</html>
