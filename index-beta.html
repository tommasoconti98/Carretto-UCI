<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Carretto UCI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root { 
            --bg: #000000; 
            --card: #1C1C1E; 
            --accent: #0A84FF; 
            --red: #FF453A; 
            --orange: #FF9F0A; 
            --green: #32D74B; 
            --text-gray: #8E8E93;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            background: var(--bg); color: white; margin: 0; 
            padding: 0 0 env(safe-area-inset-bottom);
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px; 
            position: sticky; top: 0; background: var(--bg); z-index: 100;
        }
        .total-amount { font-size: 32px; font-weight: 800; white-space: nowrap; letter-spacing: -1px; }
        .header-btns { display: flex; gap: 12px; }
        .btn-circle { width: 48px; height: 48px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }

        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px; }
        
        .product-card { 
            background: var(--card); border-radius: 16px; padding: 18px 10px;
            color: white; text-align: center; display: flex; flex-direction: column;
            justify-content: center; min-height: 120px; position: relative;
            transition: transform 0.3s ease; border: 2px solid transparent;
        }
        
        .p-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; display: block; color: white; }
        .p-price { font-size: 14px; color: var(--accent); font-weight: 500; display: block; }

        /* --- EDIT MODE (FORZATA) --- */
        .edit-active .product-card { border: 1px dashed #555; }
        
        /* Contorno intorno al testo quando si modifica */
        .edit-active .p-name { border: 1px solid var(--orange); border-radius: 4px; padding: 4px; margin-bottom: 8px; background: #222; }
        .edit-active .p-price { border: 1px solid var(--accent); border-radius: 4px; padding: 4px; background: #222; }

        /* Pulsanti visibili con colori forti */
        .delete-btn {
            position: absolute; top: 8px; right: 8px;
            background: var(--red) !important; color: white !important;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; z-index: 10; border: none;
        }
        .drag-handle {
            position: absolute; top: 8px; left: 8px;
            background: var(--orange) !important; color: black !important;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 10; border: none; cursor: move;
        }

        .add-card { background: transparent; border: 2px dashed #333; color: #333; font-size: 40px; cursor: pointer; }

        /* --- FOOTER --- */
        .footer-actions { padding: 20px; display: flex; gap: 15px; justify-content: center; margin-bottom: 60px; }
        .btn-act { flex: 1; max-width: 150px; padding: 14px; border-radius: 25px; font-size: 15px; font-weight: 700; border: none; }
        .btn-edit { background: #1c1c1e; color: var(--text-gray); border: 1px solid #333; }
        .edit-mode-on .btn-edit { background: var(--green); color: white; }
        .btn-reset { background: #1c1c1e; color: var(--red); border: 1px solid #333; display: none; }
        .edit-mode-on .btn-reset { display: block; }

        /* --- ALTRI --- */
        .sheet { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .credits { text-align: center; margin-top: 50px; padding-bottom: 30px; color: var(--text-gray); font-size: 13px; }
        #haptic-trigger { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body id="main-body">

    <div id="haptic-trigger">
        <input type="checkbox" id="haptic-switch">
        <label for="haptic-switch" id="haptic-label"></label>
    </div>

    <div class="header">
        <div class="total-box"><div id="main-total" class="total-amount">€ 0,00</div></div>
        <div class="header-btns">
            <button class="btn-circle" style="background: var(--red)" onclick="triggerHaptic(); clearCart()">🗑</button>
            <button class="btn-circle" style="background: var(--orange)" onclick="triggerHaptic(); toggleSheet('report-sheet', true)">📊</button>
            <button class="btn-circle" style="background: #333" id="pay-btn-icon" onclick="triggerHaptic(); toggleSheet('pay-sheet', true)" disabled>💳</button>
        </div>
    </div>

    <div class="grid" id="product-grid"></div>

    <div class="footer-actions">
        <button class="btn-act btn-reset" onclick="restoreDefaults()">RESET</button>
        <button class="btn-act btn-edit" id="edit-btn-main" onclick="toggleEditMode()">EDIT</button>
    </div>

    <div id="report-sheet" class="sheet">
        <div style="padding:20px; display:flex; justify-content:space-between"><span style="font-size:32px; font-weight:800">Report</span><button onclick="toggleSheet('report-sheet', false)">✕</button></div>
        <div id="report-list" style="padding:20px; flex:1"></div>
        <div class="credits">Credits Tommaso Conti<br><a href="mailto:tommasoconti98@gmail.com">tommasoconti98@gmail.com</a></div>
    </div>

    <div id="pay-sheet" class="sheet">
        <div style="padding:20px; display:flex; justify-content:space-between"><span style="font-size:32px; font-weight:800">Cassa</span><button onclick="toggleSheet('pay-sheet', false)">✕</button></div>
        <div id="order-summary" style="padding:20px"></div>
    </div>

    <script>
        const defaultProdotti = [
            {nome:"Pop Corn Salati", prezzo:5.60}, {nome:"Pop Corn Dolci", prezzo:6.60},
            {nome:"Coca/Fanta/Tè (PET)", prezzo:4.00}, {nome:"Acqua Nat 1L", prezzo:2.90},
            {nome:"Acqua Friz 0,7L", prezzo:2.60}, {nome:"M&M'S (Arachidi / Cioccolato / Mini)", prezzo:4.90},
            {nome:"M&M'S Caramello Salato", prezzo:4.30}, {nome:"Candy Cup", prezzo:8.00},
            {nome:"Chupa Chups", prezzo:1.20}, {nome:"Pop Corn Cioccolato", prezzo:3.90},
            {nome:"Patatine Lays", prezzo:3.90}, {nome:"Nastro Azzurro", prezzo:4.00},
            {nome:"Mikado", prezzo:3.50}, {nome:"Skittles", prezzo:4.10},
            {nome:"Salamini Beretta", prezzo:3.50}, {nome:"Barretta Chupa", prezzo:2.00},
            {nome:"Maltisers", prezzo:4.90}, {nome:"Monster", prezzo:3.40},
            {nome:"Rose of Dolomities", prezzo:2.50}, {nome:"Quadratini Loacker", prezzo:3.50}
        ];

        let listino = JSON.parse(localStorage.getItem('uci_v8_listino')) || [...defaultProdotti];
        let carrello = [];
        let isEditMode = false;
        let dragIdx = null;

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(15);
            const lbl = document.getElementById('haptic-label');
            if (lbl) lbl.click();
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            // Applica classe alla griglia per attivare il CSS speciale
            if (isEditMode) grid.classList.add('edit-active');
            else grid.classList.remove('edit-active');

            listino.forEach((p, index) => {
                const card = document.createElement(isEditMode ? 'div' : 'button');
                card.className = 'product-card';
                card.dataset.index = index;
                
                if (isEditMode) {
                    card.innerHTML = `
                        <div class="drag-handle" ontouchstart="startDrag(${index})" onmousedown="startDrag(${index})">≡</div>
                        <div class="delete-btn" onclick="deleteProduct(${index})">✕</div>
                        <div class="p-name" contenteditable="true" onblur="updateText(${index}, 'nome', this.innerText)">${p.nome}</div>
                        <div class="p-price" contenteditable="true" onblur="updateText(${index}, 'prezzo', this.innerText)">${Number(p.prezzo).toFixed(2).replace('.',',')}</div>
                    `;
                } else {
                    card.innerHTML = `<span class="p-name">${p.nome}</span><span class="p-price">€ ${Number(p.prezzo).toFixed(2).replace('.',',')}</span>`;
                    card.onclick = () => { triggerHaptic(); addToCart(p); };
                }
                grid.appendChild(card);
            });

            if (isEditMode) {
                const addBtn = document.createElement('div');
                addBtn.className = 'product-card add-card';
                addBtn.innerHTML = '+';
                addBtn.onclick = addNewProduct;
                grid.appendChild(addBtn);
            }
        }

        function startDrag(index) {
            dragIdx = index;
            triggerHaptic();
        }

        // Sistema di drag universale
        window.onmousemove = (e) => handleMove(e.clientX, e.clientY);
        window.ontouchmove = (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY);
        window.onmouseup = window.ontouchend = () => dragIdx = null;

        function handleMove(x, y) {
            if (dragIdx === null) return;
            const target = document.elementFromPoint(x, y);
            const overCard = target?.closest('.product-card');
            if (overCard && overCard.dataset.index != dragIdx && !overCard.classList.contains('add-card')) {
                const overIdx = parseInt(overCard.dataset.index);
                const item = listino.splice(dragIdx, 1)[0];
                listino.splice(overIdx, 0, item);
                dragIdx = overIdx;
                renderGrid();
            }
        }

        function toggleEditMode() {
            triggerHaptic();
            isEditMode = !isEditMode;
            const body = document.getElementById('main-body');
            const btn = document.getElementById('edit-btn-main');
            
            if (isEditMode) {
                body.classList.add('edit-mode-on');
                btn.innerText = "SALVA";
            } else {
                body.classList.remove('edit-mode-on');
                btn.innerText = "EDIT";
                localStorage.setItem('uci_v8_listino', JSON.stringify(listino));
            }
            renderGrid();
        }

        function updateText(index, field, val) {
            if (field === 'prezzo') listino[index].prezzo = parseFloat(val.replace(',', '.')) || 0;
            else listino[index].nome = val;
        }

        function restoreDefaults() {
            if(confirm("Tornare al listino originale UCI?")) {
                triggerHaptic();
                listino = JSON.parse(JSON.stringify(defaultProdotti));
                localStorage.setItem('uci_v8_listino', JSON.stringify(listino));
                renderGrid();
            }
        }

        function addNewProduct() { triggerHaptic(); listino.push({nome: "Nuovo", prezzo: 0.00}); renderGrid(); }
        function deleteProduct(index) { triggerHaptic(); listino.splice(index, 1); renderGrid(); }
        function addToCart(p) { carrello.push(p); updateUI(); }
        function updateUI() {
            const tot = carrello.reduce((acc, p) => acc + Number(p.prezzo), 0);
            document.getElementById('main-total').innerText = `€ ${tot.toFixed(2).replace('.',',')}`;
            const btn = document.getElementById('pay-btn-icon');
            btn.disabled = carrello.length === 0;
            btn.style.background = carrello.length > 0 ? 'var(--green)' : '#333';
        }
        function clearCart() { carrello = []; updateUI(); }
        function toggleSheet(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }

        renderGrid();
    </script>
</body>
</html>
