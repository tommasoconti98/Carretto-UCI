<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Carretto UCI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root { 
            --bg: #000000; 
            --card: #1C1C1E; 
            --accent: #0A84FF; 
            --red: #FF453A; 
            --orange: #FF9F0A; 
            --green: #32D74B; 
            --text-gray: #8E8E93;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; 
            background: var(--bg); color: white; margin: 0; 
            padding: 0 0 env(safe-area-inset-bottom);
            overflow-x: hidden;
        }

        body.modal-open { overflow: hidden; position: fixed; width: 100%; }

        /* --- HEADER --- */
        .header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: calc(20px + env(safe-area-inset-top)) 20px 20px; 
            position: sticky; top: 0; background: var(--bg); z-index: 100;
        }
        .total-amount { font-size: 32px; font-weight: 800; white-space: nowrap; letter-spacing: -1px; }
        .header-btns { display: flex; gap: 12px; }
        .btn-circle { width: 48px; height: 48px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }

        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px; }
        
        .product-card { 
            background: var(--card); border: none; border-radius: 16px; padding: 18px 10px;
            color: white; text-align: center; display: flex; flex-direction: column;
            justify-content: center; min-height: 110px; position: relative;
            transition: transform 0.3s ease, opacity 0.2s;
        }
        
        .p-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; display: block; }
        .p-price { font-size: 14px; color: var(--accent); font-weight: 500; display: block; }
        
        button.product-card:active { background: #2C2C2E; transform: scale(0.96); }

        /* --- EDIT MODE --- */
        .edit-mode .product-card { border: 1px dashed #444; }
        .edit-mode .product-card.dragging { opacity: 0.5; transform: scale(1.05); z-index: 1000; }

        /* Formattazione Input "Invisibili" */
        .edit-mode .input-container { display: flex; flex-direction: column; width: 100%; }
        
        .edit-mode input {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            text-align: center;
            width: 100%;
            font-family: inherit;
            padding: 0;
            margin: 0;
            display: block;
        }
        .edit-mode .edit-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: white !important; }
        .edit-mode .edit-price { font-size: 14px; font-weight: 500; color: var(--accent) !important; }

        /* Pulsanti X e Handle */
        .delete-btn, .drag-handle {
            position: absolute; width: 28px; height: 28px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            z-index: 10; border: none; cursor: pointer;
        }
        .edit-mode .delete-btn, .edit-mode .drag-handle { display: flex; }

        .delete-btn { top: -10px; right: -10px; background: var(--red); color: white; font-size: 14px; font-weight: bold; }
        .drag-handle { top: -10px; left: -10px; background: #333; color: var(--text-gray); font-size: 18px; touch-action: none; }

        .add-card {
            background: transparent; border: 2px dashed #333;
            color: #333; font-size: 40px; font-weight: 300; cursor: pointer;
        }

        /* --- FOOTER --- */
        .footer-actions { padding: 20px; display: flex; gap: 15px; justify-content: center; margin-bottom: 60px; }
        .btn-act { flex: 1; max-width: 140px; padding: 12px; border-radius: 25px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
        .btn-edit { background: #1c1c1e; color: var(--text-gray); border: 1px solid #333; }
        .btn-reset { background: #1c1c1e; color: var(--red); border: 1px solid #333; display: none; }
        
        .edit-mode-active .btn-edit { background: var(--green); color: white; border: none; }
        .edit-mode-active .btn-reset { display: block; }

        /* --- ALTRI ELEMENTI --- */
        .sheet { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: calc(15px + env(safe-area-inset-top)) 20px 15px; }
        .credits { text-align: center; margin-top: 50px; padding-bottom: 30px; color: var(--text-gray); font-size: 13px; }
        #haptic-trigger { position: absolute; opacity: 0; pointer-events: none; visibility: hidden; }
    </style>
</head>
<body>

    <div id="haptic-trigger">
        <input type="checkbox" id="haptic-switch">
        <label for="haptic-switch" id="haptic-label"></label>
    </div>

    <div class="header">
        <div class="total-box">
            <div id="main-total" class="total-amount">€ 0,00</div>
        </div>
        <div class="header-btns">
            <button class="btn-circle" style="background: var(--red)" onclick="triggerHaptic(); clearCart()">🗑</button>
            <button class="btn-circle" style="background: var(--orange)" onclick="triggerHaptic(); toggleSheet('report-sheet', true)">📊</button>
            <button class="btn-circle" style="background: #333" id="pay-btn-icon" onclick="triggerHaptic(); toggleSheet('pay-sheet', true)" disabled>💳</button>
        </div>
    </div>

    <div class="grid" id="product-grid"></div>

    <div class="footer-actions" id="footer-area">
        <button class="btn-act btn-reset" onclick="restoreDefaults()">RESET</button>
        <button class="btn-act btn-edit" onclick="toggleEditMode()">EDIT</button>
    </div>

    <div id="report-sheet" class="sheet">
        <div class="sheet-header">
            <span style="font-size:32px; font-weight:800">Report</span>
            <button onclick="toggleSheet('report-sheet', false)" style="background:#222; border:none; color:white; border-radius:50%; width:32px; height:32px">✕</button>
        </div>
        <div id="report-content" style="padding:20px">
            <div id="report-list"></div>
            <button class="btn-act btn-red" style="width:100%; max-width:none; margin-top:20px" onclick="resetReport()">AZZERA GIORNATA</button>
            <div class="credits">Credits Tommaso Conti<br><a href="mailto:tommasoconti98@gmail.com" style="color:var(--accent); text-decoration:none">tommasoconti98@gmail.com</a></div>
        </div>
    </div>

    <div id="pay-sheet" class="sheet">
        <div class="sheet-header">
            <span style="font-size:32px; font-weight:800">Cassa</span>
            <button onclick="toggleSheet('pay-sheet', false)" style="background:#222; border:none; color:white; border-radius:50%; width:32px; height:32px">✕</button>
        </div>
        <div id="order-summary" style="padding:20px"></div>
    </div>

    <script>
        const defaultProdotti = [
            {nome:"Pop Corn Salati", prezzo:5.60}, {nome:"Pop Corn Dolci", prezzo:6.60},
            {nome:"Coca/Fanta/Tè (PET)", prezzo:4.00}, {nome:"Acqua Nat 1L", prezzo:2.90},
            {nome:"Acqua Friz 0,7L", prezzo:2.60}, {nome:"M&M'S (Arachidi / Cioccolato / Mini)", prezzo:4.90},
            {nome:"M&M'S Caramello Salato", prezzo:4.30}, {nome:"Candy Cup", prezzo:8.00},
            {nome:"Chupa Chups", prezzo:1.20}, {nome:"Pop Corn Cioccolato", prezzo:3.90},
            {nome:"Patatine Lays", prezzo:3.90}, {nome:"Nastro Azzurro", prezzo:4.00},
            {nome:"Mikado", prezzo:3.50}, {nome:"Skittles", prezzo:4.10},
            {nome:"Salamini Beretta", prezzo:3.50}, {nome:"Barretta Chupa", prezzo:2.00},
            {nome:"Maltisers", prezzo:4.90}, {nome:"Monster", prezzo:3.40},
            {nome:"Rose of Dolomities", prezzo:2.50}, {nome:"Quadratini Loacker", prezzo:3.50}
        ];

        let listino = JSON.parse(localStorage.getItem('uci_v8_listino')) || [...defaultProdotti];
        let carrello = [];
        let stats = JSON.parse(localStorage.getItem('uci_v8_stats')) || { carta: 0, contanti: 0, vendite: {} };
        let isEditMode = false;
        let dragIdx = null;

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(15);
            const lbl = document.getElementById('haptic-label');
            if (lbl) lbl.click();
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            listino.forEach((p, index) => {
                const card = document.createElement(isEditMode ? 'div' : 'button');
                card.className = 'product-card';
                card.dataset.index = index;
                
                if (isEditMode) {
                    card.innerHTML = `
                        <div class="drag-handle">≡</div>
                        <div class="delete-btn" onclick="deleteProduct(${index})">✕</div>
                        <div class="input-container">
                            <input type="text" class="edit-name" value="${p.nome}" oninput="updateProduct(${index}, 'nome', this.value)">
                            <input type="number" step="0.1" class="edit-price" value="${p.prezzo}" oninput="updateProduct(${index}, 'prezzo', this.value)">
                        </div>
                    `;
                    
                    // Logica Drag (Mouse + Touch)
                    const handle = card.querySelector('.drag-handle');
                    
                    const startDrag = (e) => {
                        dragIdx = index;
                        card.classList.add('dragging');
                        triggerHaptic();
                    };

                    const moveDrag = (e) => {
                        if (dragIdx === null) return;
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                        const target = document.elementFromPoint(clientX, clientY);
                        const overCard = target?.closest('.product-card');
                        
                        if (overCard && overCard.dataset.index != dragIdx && !overCard.classList.contains('add-card')) {
                            const overIdx = parseInt(overCard.dataset.index);
                            const item = listino.splice(dragIdx, 1)[0];
                            listino.splice(overIdx, 0, item);
                            dragIdx = overIdx;
                            renderGrid();
                        }
                        if(e.cancelable) e.preventDefault();
                    };

                    handle.onmousedown = startDrag;
                    window.onmousemove = moveDrag;
                    window.onmouseup = () => { dragIdx = null; card.classList.remove('dragging'); };

                    handle.ontouchstart = startDrag;
                    handle.ontouchmove = moveDrag;
                    handle.ontouchend = () => { dragIdx = null; card.classList.remove('dragging'); };

                } else {
                    card.innerHTML = `<span class="p-name">${p.nome}</span><span class="p-price">€ ${Number(p.prezzo).toFixed(2).replace('.',',')}</span>`;
                    card.onclick = () => { triggerHaptic(); addToCart(p); };
                }
                grid.appendChild(card);
            });

            if (isEditMode) {
                const addBtn = document.createElement('div');
                addBtn.className = 'product-card add-card';
                addBtn.innerHTML = '+';
                addBtn.onclick = addNewProduct;
                grid.appendChild(addBtn);
                document.getElementById('footer-area').classList.add('edit-mode-active');
            } else {
                document.getElementById('footer-area').classList.remove('edit-mode-active');
            }
        }

        function toggleEditMode() {
            triggerHaptic();
            isEditMode = !isEditMode;
            document.querySelector('.btn-edit').innerText = isEditMode ? "SALVA" : "EDIT";
            if (!isEditMode) localStorage.setItem('uci_v8_listino', JSON.stringify(listino));
            renderGrid();
        }

        function restoreDefaults() {
            if(confirm("Tornare al listino UCI originale?")) {
                triggerHaptic();
                listino = JSON.parse(JSON.stringify(defaultProdotti));
                localStorage.setItem('uci_v8_listino', JSON.stringify(listino));
                renderGrid();
            }
        }

        function updateProduct(index, field, value) {
            listino[index][field] = field === 'prezzo' ? parseFloat(value) || 0 : value;
        }

        function addNewProduct() { triggerHaptic(); listino.push({nome: "Nuovo", prezzo: 0.00}); renderGrid(); }
        function deleteProduct(index) { triggerHaptic(); listino.splice(index, 1); renderGrid(); }
        function addToCart(p) { carrello.push(p); updateUI(); }

        function updateUI() {
            const tot = carrello.reduce((acc, p) => acc + Number(p.prezzo), 0);
            document.getElementById('main-total').innerText = `€ ${tot.toFixed(2).replace('.',',')}`;
            const btn = document.getElementById('pay-btn-icon');
            btn.disabled = carrello.length === 0;
            btn.style.background = carrello.length > 0 ? 'var(--green)' : '#333';
        }

        function clearCart() { carrello = []; updateUI(); }

        function toggleSheet(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
            if(show) {
                document.body.classList.add('modal-open');
                if(id === 'report-sheet') renderReport();
            } else { document.body.classList.remove('modal-open'); }
        }

        function renderReport() {
            const tot = stats.carta + stats.contanti;
            document.getElementById('report-list').innerHTML = `
                <div style="padding:15px; background:var(--card); border-radius:15px">
                    <div style="display:flex; justify-content:space-between; padding:10px 0"><span>Carta</span><span>€ ${stats.carta.toFixed(2)}</span></div>
                    <div style="display:flex; justify-content:space-between; padding:10px 0"><span>Contanti</span><span>€ ${stats.contanti.toFixed(2)}</span></div>
                    <div style="display:flex; justify-content:space-between; padding:10px 0; font-weight:800; color:var(--green)"><span>TOTALE</span><span>€ ${tot.toFixed(2)}</span></div>
                </div>
            `;
        }

        function resetReport() {
            if(confirm("Azzerare tutto?")) {
                triggerHaptic();
                stats = { carta: 0, contanti: 0, vendite: {} };
                localStorage.setItem('uci_v8_stats', JSON.stringify(stats));
                renderReport();
            }
        }

        renderGrid();
    </script>
</body>
</html>
